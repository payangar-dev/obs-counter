# =============================================================================
# GitHub Actions - Build OBS Plugin (Linux + Windows)
# =============================================================================
# Ce workflow compile automatiquement le plugin pour Linux et Windows
# à chaque push ou pull request.
#
# Les artifacts (fichiers compilés) sont téléchargeables depuis l'onglet
# "Actions" de GitHub, dans les détails du workflow run.
# =============================================================================

name: Build OBS Plugin

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  PLUGIN_NAME: obs-counter-dock
  OBS_VERSION: "32.0.4"

jobs:
  # ===========================================================================
  # Build Linux
  # ===========================================================================
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            libobs-dev \
            qt6-base-dev \
            pkg-config

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare artifact
        run: |
          mkdir -p artifact/obs-counter-dock/bin/64bit
          cp build/libobs-counter-dock.so artifact/obs-counter-dock/bin/64bit/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-counter-dock-linux
          path: artifact/

  # ===========================================================================
  # Build Windows
  # ===========================================================================
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Installation de Qt6
      # -----------------------------------------------------------------------
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          cache: true

      # -----------------------------------------------------------------------
      # Téléchargement des sources OBS (pour les headers)
      # -----------------------------------------------------------------------
      - name: Download OBS sources
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/obsproject/obs-studio/archive/refs/tags/${{ env.OBS_VERSION }}.zip" `
            -OutFile obs-src.zip
          Expand-Archive -Path obs-src.zip -DestinationPath .
          Rename-Item "obs-studio-${{ env.OBS_VERSION }}" obs-studio

      # -----------------------------------------------------------------------
      # Téléchargement OBS portable et génération des .lib
      # -----------------------------------------------------------------------
      - name: Download OBS portable
        run: |
          # OBS 32+ utilise un format de nom différent pour les releases Windows
          Invoke-WebRequest `
            -Uri "https://github.com/obsproject/obs-studio/releases/download/${{ env.OBS_VERSION }}/OBS-Studio-${{ env.OBS_VERSION }}-Windows-x64.zip" `
            -OutFile obs-portable.zip
          Expand-Archive -Path obs-portable.zip -DestinationPath obs-install

          # Affiche la structure pour debug
          Write-Host "=== Structure obs-install ==="
          Get-ChildItem -Path obs-install -Recurse -Depth 2 | ForEach-Object { Write-Host $_.FullName }

      - name: Generate .lib files from .dll
        shell: cmd
        run: |
          @echo off
          REM Les .lib ne sont pas distribués par OBS, on les génère à partir des .dll
          REM en utilisant les outils Visual Studio (dumpbin + lib)

          REM Initialise l'environnement Visual Studio (nécessaire pour dumpbin et lib)
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"

          cd obs-install\bin\64bit

          REM Génère obs.lib
          echo LIBRARY obs.dll > obs.def
          echo EXPORTS >> obs.def
          for /f "tokens=4" %%a in ('dumpbin /exports obs.dll ^| findstr /r "^[ ]*[0-9]"') do echo %%a >> obs.def
          lib /def:obs.def /out:obs.lib /machine:x64

          REM Génère obs-frontend-api.lib
          echo LIBRARY obs-frontend-api.dll > obs-frontend-api.def
          echo EXPORTS >> obs-frontend-api.def
          for /f "tokens=4" %%a in ('dumpbin /exports obs-frontend-api.dll ^| findstr /r "^[ ]*[0-9]"') do echo %%a >> obs-frontend-api.def
          lib /def:obs-frontend-api.def /out:obs-frontend-api.lib /machine:x64

          echo === Generated .lib files ===
          dir *.lib

      # -----------------------------------------------------------------------
      # Configuration et compilation
      # -----------------------------------------------------------------------
      - name: Configure CMake
        run: |
          $libDir = "${{ github.workspace }}/obs-install/bin/64bit"
          Write-Host "OBS lib dir: $libDir"
          Write-Host "Contents:"
          Get-ChildItem -Path $libDir -Filter "*.lib" | ForEach-Object { Write-Host $_.FullName }

          cmake -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DOBS_SOURCE_DIR="${{ github.workspace }}/obs-studio" `
            -DOBS_LIB_DIR="$libDir"

      - name: Build
        run: cmake --build build --config Release

      # -----------------------------------------------------------------------
      # Préparation de l'artifact (ZIP)
      # -----------------------------------------------------------------------
      - name: Prepare artifact
        run: |
          New-Item -ItemType Directory -Force -Path artifact/obs-counter-dock/bin/64bit

          # Copie le .dll depuis le dossier Release
          $dllPath = Get-ChildItem -Path build -Recurse -Filter "*.dll" | Select-Object -First 1
          if ($dllPath) {
            Copy-Item $dllPath.FullName artifact/obs-counter-dock/bin/64bit/
            Write-Host "DLL found and copied: $($dllPath.FullName)"
          } else {
            Write-Host "Warning: No DLL found!"
            Get-ChildItem -Path build -Recurse | ForEach-Object { Write-Host $_.FullName }
          }

      # -----------------------------------------------------------------------
      # Création de l'installateur NSIS
      # -----------------------------------------------------------------------
      - name: Install NSIS
        run: |
          choco install nsis -y

      - name: Build NSIS installer
        run: |
          # Copie le DLL dans le dossier du script NSIS
          $dllPath = Get-ChildItem -Path build -Recurse -Filter "*.dll" | Select-Object -First 1
          if ($dllPath) {
            Copy-Item $dllPath.FullName installer/windows/obs-counter-dock.dll
          }

          # Compile l'installateur
          cd installer/windows
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi

          # Déplace l'installateur vers le dossier artifact
          Move-Item obs-counter-dock-installer.exe ../../artifact/

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-counter-dock-windows
          path: artifact/

  # ===========================================================================
  # Création d'une release (uniquement sur tag)
  # ===========================================================================
  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create zip archives
        run: |
          cd obs-counter-dock-linux
          zip -r ../obs-counter-dock-linux.zip .
          cd ../obs-counter-dock-windows
          # L'installateur est déjà un exe, on le garde séparé
          mv obs-counter-dock-installer.exe ../
          zip -r ../obs-counter-dock-windows.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            obs-counter-dock-linux.zip
            obs-counter-dock-windows.zip
            obs-counter-dock-installer.exe
          generate_release_notes: true
